.setg{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:start}
.setg .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.setg .card h2{font-size:15px;margin-bottom:4px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow>span{color:var(--tx2)}
.acts-c{white-space:nowrap;text-align:right}
.acts-c button+button{margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(700px,100%);max-height:92vh;overflow:auto}
.dlg h2{font-size:20px;margin-bottom:4px}
.swatches{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:38px}
.sw{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--line2)}
.sw[aria-pressed=true]{outline:2px solid var(--acc);outline-offset:2px}
.swc{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:12px;color:var(--mut);cursor:pointer}
.swc input{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line2);overflow:hidden;cursor:pointer;background:none}
.swc.on input{outline:2px solid var(--acc);outline-offset:2px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px}
.ty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);font-size:12px}
.ty img{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain}
.ty[aria-pressed=true]{border-color:var(--acc);color:var(--acc);font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:12px;margin-top:6px;min-height:15px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.hint{font-size:12px;color:var(--mut);line-height:1.55;margin:8px 0 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;display:none;z-index:20}
.blank{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;color:var(--mut);gap:12px}
.blank h1{font-size:20px;color:var(--tx)}
.simflag{font-size:11px;color:var(--steam)}
@media (max-width:1280px){.layout{grid-template-columns:230px minmax(0,1fr)}.mgrid{grid-template-columns:1fr 1fr}.mgrid .card:last-child{grid-column:1/3}.sgrid,.setg{grid-template-columns:1fr}}
@media (max-width:1180px),(max-height:639px){.mview,.home,.store{height:auto}.mview{display:flex;flex-direction:column}.panel{min-height:560px;display:flex;flex-direction:column}.panel>*{flex:1}.lv{height:auto}.stage{min-height:460px}.side .shots .tb{max-height:420px}.hgrid .card.grow{min-height:260px}.sgrid{min-height:420px}}
@media (max-width:1400px){.strip>div{padding:2px 14px}.strip dd{font-size:21px}.shead h1{font-size:28px}}
@media (max-width:960px){.clock{display:none}.hnav{order:3;flex:none;width:calc(100% + 28px);margin:0 -14px;padding:0 4px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.hnav::before{display:none}.hnav button{min-height:46px;padding:0 11px;font-size:13px}.hmeta{margin-left:auto;gap:10px}.hmeta>*+*{padding-left:10px}.strip{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px 0}.strip>div:nth-child(odd){border-left:0;padding-left:0}.shead .acts{width:100%}.setl{grid-template-columns:1fr}.snav{flex-direction:row;overflow-x:auto;position:static}.snav button{white-space:nowrap}.mview{display:flex;flex-direction:column;height:auto}.panel{min-height:0}body.locked{display:flex}body{height:auto;display:block}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}main{overflow:visible}.prod,.mnt,.store{display:flex;flex-direction:column;height:auto;min-height:0}.pgrid,.mgrid,.sgrid,.hgrid{grid-template-columns:1fr}.home{display:flex;flex-direction:column;height:auto}.pcol .chart{height:220px;flex:none}.pcol2 .tb{max-height:380px}.att{max-height:none}.mgrid .card:last-child{grid-column:auto}.mcards{overflow:visible}.mc{grid-template-columns:96px minmax(0,1fr)}.mc img{width:96px;height:74px}.chart{height:220px}.scroll{height:auto;max-height:360px}.clock{display:none}.types{grid-template-columns:repeat(2,1fr)}.f2{grid-template-columns:1fr}button,.tab{min-height:44px}button.sm{min-height:40px}.sw,.swc input{width:40px;height:40px}header{flex-wrap:wrap;gap:10px;padding:8px 14px 0}.setg table th:nth-child(4),.setg table td:nth-child(4){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let LANG=LS.get('naussa_lang','id');if(!I18N[LANG])LANG='id';
const t=(k,...a)=>{const v=I18N[LANG][k]!==undefined?I18N[LANG][k]:I18N.id[k];return typeof v==='function'?v(...a):v};
const LOC=()=>LANG==='en'?'en-GB':'id-ID';

const TYPES={
 'Vienni 1 GR':{g:1,nt:0,spT:false,steamIdx:0,sens:['steam','brew'],shape:1},
 'Vienni 2 GR':{g:2,nt:0,spT:false,steamIdx:0,sens:['steam','brew'],shape:2},
 'AV 1 GR':{g:1,nt:1,spT:true,steamIdx:1,sens:['temp1','steam','brew'],shape:1},
 'AV 2 GR':{g:2,nt:2,spT:true,steamIdx:2,sens:['temp1','temp2','steam','brew'],shape:2}
};
function boilers(type){const T=TYPES[type];return T.nt===0?[t('b_boiler')]:T.nt===1?[t('b_coffee'),t('b_steam')]:[t('b_coffee_n',1),t('b_coffee_n',2),t('b_steam')]}
function tempNames(type){const T=TYPES[type];return T.nt===1?[t('b_coffee')]:T.nt===2?[t('b_coffee_n',1),t('b_coffee_n',2)]:[]}
const FLOWGRP=(ty,i)=>TYPES[ty].g===2?(i===1?2:1):1;
const DEF_LIMIT=2000,DEF_WARN=80;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT=ts=>new Date(ts).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit',hour12:false}).replace('.',':');
const fmtD=ts=>new Date(ts).toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'});
const fmtDs=ts=>new Date(ts).toLocaleDateString(LOC(),{day:'numeric',month:'short'});
const fmtN=n=>Math.round(n).toLocaleString(LOC());
const f1=(v,d)=>(+v||0).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const isoDay=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDay=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c).getTime()};
const stTxt=s=>t('st_'+s);

/* state */
const NO_STORE='Tanpa toko';
const dStore=s=>s===NO_STORE?t('no_store'):s;
function normM(m){m.store=(m.store||'').trim()||NO_STORE;m.tgt=m.tgt||{t:[25,32],v:[30,45]};m.interval=m.interval||90;m.added=m.added||isoDay(Date.now());m.svc=m.svc||[];m.log=m.log||[];m.flows=TYPES[m.type]?TYPES[m.type].g:1;m.color=m.color||'#f4f4f2'}
let state=JSON.parse($('#state').textContent);state.machines.forEach(normM);

 for(let d=start;d<sod(now)+DAY;d+=DAY){const wd=new Date(d).getDay(),f=(wd===0||wd===6)?1.35:1;
  for(let g=1;g<=T.g;g++){const n=Math.round(base*f*(0.7+Math.random()*0.6)*(g===2?0.8:1));
   for(let i=0;i<n;i++){const ts=d+(7+Math.random()*14)*36e5;if(ts>now)continue;const cal=Math.random()<0.03?1:0;h.push([ts,g,cal?Math.round(8+Math.random()*6):Math.round(24+Math.random()*9),cal?Math.round(20+Math.random()*10):Math.round(32+Math.random()*14),+(8.6+Math.random()*0.8).toFixed(1),cal,cal?null:++cnt])}}}

/* session */

function stopData(){if(client){try{client.end(true)}catch(e){}client=null}clearInterval(timer)}

function boot(){

 startData();renderList();renderMain();tick()}
if(window.claude&&claude.use){

boot();
